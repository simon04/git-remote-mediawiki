---
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uvx ruff check git_mediawiki.py git-mw git-remote-mediawiki t/test-gitmw.py

  editorconfig:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Editorconfig
        uses: zbeekman/EditorConfig-Action@master
        env:
          GITHUB_TOKEN: ${{ github.token }}
