# This is not a distributable Python package: git-remote-mediawiki,
# git-mw and t/test-gitmw.py are PEP 723 scripts that declare their own
# dependencies and are installed by copying them into Git's exec path. This
# file exists to pin the development tooling and configure it, hence
# package = false and an empty dependency list.

[project]
name = "git-remote-mediawiki"
version = "0.01"
description = "Gateway between Git and MediaWiki"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff",
    "ty",
    # The scripts declare these inline, but ty resolves imports from the
    # environment, so it needs them here too.
    "mwclient>=0.11",
    "requests",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# The two executables have no .py suffix, so name them explicitly.
extend-include = ["git-remote-mediawiki", "git-mw"]

[tool.ruff.lint]
extend-select = ["E", "W", "I", "UP", "B", "C4", "FURB", "RUF"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# ty only discovers *.py on its own, and globs do not match an extensionless
# file either, so name every file. git_mediawiki.py is reached through
# --extra-search-path: ty gives a PEP 723 script an isolated environment, and
# neither environment.extra-paths nor environment.root applies to one.
include = [
    "git_mediawiki.py",
    "git-remote-mediawiki",
    "git-mw",
    "t/test-gitmw.py",
    "t/fakewiki.py",
    "t/gitmwtest.py",
    "t/test_continuing_queries.py",
    "t/test_push_pull.py",
    "t/test_clone.py",
]
